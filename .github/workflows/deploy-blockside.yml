name: Deploy BLOCKSIDE to blockside-game

on:
  push:
    branches:
      - claude/create-pi-network-game-YXN4V
      - main
    paths:
      - '_blockside_update/game/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pi-eBook-Store
        uses: actions/checkout@v4
        with:
          path: Pi-eBook-Store

      - name: Checkout blockside-game
        uses: actions/checkout@v4
        with:
          repository: gbobombana-png/blockside-game
          token: ${{ secrets.BLOCKSIDE_DEPLOY_PAT }}
          path: blockside-game

      - name: Copy game files
        run: |
          cp Pi-eBook-Store/_blockside_update/game/index.html blockside-game/game/index.html

      - name: Commit and push
        run: |
          cd blockside-game
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add game/index.html
          git diff --staged --quiet || git commit -m "chore: auto-deploy from Pi-eBook-Store [$(date +'%Y-%m-%d %H:%M')]"
          git push origin main
