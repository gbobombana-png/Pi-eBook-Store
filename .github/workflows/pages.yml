name: Deploy BLOCKSIDE to GitHub Pages

on:
  push:
    branches: [main, claude/create-pi-network-game-YXN4V]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build static site
        run: |
          mkdir -p _site
          # Landing page
          cp -r landing/ _site/landing/
          # Game prototype
          cp -r game/ _site/game/
          # Root index redirects to landing
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html><head>
          <meta charset="UTF-8">
          <meta http-equiv="refresh" content="0; url=landing/">
          <title>BLOCKSIDE</title>
          </head><body>
          <p>Redirection vers <a href="landing/">BLOCKSIDE</a>…</p>
          </body></html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
